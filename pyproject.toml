[project]
name = "comarcas-brasil"
version = "0.1.0"
description = "Mapa base replicável do Brasil: país, regiões, estados, comarcas, municípios, cidades, relevo e temperatura."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "rasterio>=1.4",
    "exactextract>=0.2",
    "requests>=2.32",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
