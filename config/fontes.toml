# Todas as fontes externas do projeto, em um só lugar.
# Trocar o ano da malha ou a resolução de um raster = editar este arquivo e rodar `make tudo`.

[malha_municipal]
descricao = "Malha municipal digital do IBGE (limites dos municípios, escala 1:250.000, SIRGAS 2000)"
ano = 2024
url = "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2024/Brasil/BR_Municipios_2024.zip"
licenca = "Dados públicos IBGE — citar a fonte"
# Polígonos da malha que não são municípios (massas d'água). Entram no contorno do
# estado, mas não na camada de municípios nem na cobertura das comarcas.
nao_municipios = ["4300001", "4300002"]  # Lagoa Mirim, Lagoa dos Patos (RS)

[populacao]
descricao = "População residente por município — IBGE, Censo Demográfico 2022 (tabela SIDRA 4709, variável 93)"
url = "https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6[all]"
licenca = "Dados públicos IBGE — citar a fonte"

[cidades]
descricao = "Coordenadas das sedes municipais (cidades). Fonte comunitária derivada de bases públicas; substituir por IBGE Localidades 2022 quando o acesso estiver liberado."
url = "https://raw.githubusercontent.com/kelvins/municipios-brasileiros/main/csv/municipios.csv"
licenca = "MIT (kelvins/municipios-brasileiros)"

[relevo]
descricao = "Modelo digital de superfície Copernicus GLO-90 (90 m), lido em resolução reduzida direto da nuvem"
url_base = "https://copernicus-dem-90m.s3.amazonaws.com"
resolucao_graus = 0.01  # ~1,1 km por pixel no mapa nacional
licenca = "Copernicus DEM — © DLR e.V. 2010-2014 e © Airbus Defence and Space GmbH 2014-2018, fornecido pelo programa COPERNICUS (UE/ESA)"

[temperatura]
descricao = "Temperatura média anual (BIO1, normal 1970-2000) — WorldClim 2.1"
url = "https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_5m_bio.zip"
arquivo_no_zip = "wc2.1_5m_bio_1.tif"
licenca = "CC BY 4.0 — Fick & Hijmans (2017), WorldClim 2"

[web]
# Distância máxima (em metros) que uma borda pode se mover ao simplificar.
# media: zoom de estado; baixa: visão do Brasil inteiro.
resolucoes = { media = 250, baixa = 2500 }
largura_imagem_raster = 2048  # pixels das imagens de relevo/temperatura no navegador
